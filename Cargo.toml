[package]
name = "qaf"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rustix = { version = "1", features = ["process"] }
base64 = "0.23"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
rand = "0.10"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "signal",
  "time",
  "net",
  "sync",
] }
rustyline = { version = "19.0.0", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
textwrap = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
terminal_size = "0.4.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
