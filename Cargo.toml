[package]
name = "qaf"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rustix = { version = "1", features = ["process"] }
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "signal",
  "time",
  "net",
  "sync",
] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
